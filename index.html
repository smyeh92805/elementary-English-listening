<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>皇家大衛英文聽說練習站</title>
<link rel="icon" href="logo.jpg">
<style>
@font-face{font-family:"RDKai";src:local("DFKai-SB"),local("標楷體"),local("BiauKai"),url("fonts/kaiu.ttf") format("truetype");font-display:swap}
@font-face{font-family:"RDTimes";src:local("Times New Roman"),url("fonts/times.ttf") format("truetype");font-display:swap}
:root{--or:#E8802A;--bl:#2E75D6;--gr:#2E9E5B;--cr:#C2185B;--pu:#7B4FB8;--ink:#222;--bg:#FFF9EF;--card:#fff;--line:#E3D9C6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"RDTimes","Times New Roman","RDKai","DFKai-SB","標楷體",serif;font-size:19px;line-height:1.6}
button{font-family:inherit;font-size:inherit;cursor:pointer}
header{background:#fff;border-bottom:3px solid var(--or);position:sticky;top:0;z-index:20}
.hd{max-width:1100px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd img{height:54px;width:auto}
.hd h1{font-size:25px;margin:0;color:var(--cr);line-height:1.2}
.hd .sub{font-size:14px;color:#666}
.hd .sp{flex:1}
.tog{border:2px solid var(--pu);background:#fff;color:var(--pu);border-radius:22px;padding:4px 14px;font-size:16px;white-space:nowrap}
.tog.on{background:var(--pu);color:#fff}
.tog.gr{border-color:var(--gr);color:var(--gr)} .tog.gr.on{background:var(--gr);color:#fff}
.tog.un{border-color:var(--bl);color:var(--bl)} .tog.un.on{background:var(--bl);color:#fff}
nav{max-width:1100px;margin:0 auto;padding:0 10px 8px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:0;background:#F3ECDD;border-radius:18px;padding:5px 13px;font-size:17px;color:#444}
nav button.on{background:var(--or);color:#fff;font-weight:bold}
main{max-width:1100px;margin:0 auto;padding:16px 14px 80px}
h2{font-size:27px;margin:8px 0 10px;color:var(--cr)}
h3{font-size:22px;margin:22px 0 8px;padding:5px 12px;border-radius:8px;color:#fff;background:var(--or)}
h3.b{background:var(--bl)} h3.g{background:var(--gr)} h3.p{background:var(--pu)} h3.c{background:var(--cr)}
.lead{color:#555;margin:0 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;transition:transform .08s,border-color .1s}
button.card{display:block;width:100%}
button.card:hover{border-color:var(--or);transform:translateY(-2px)}
.card img{width:100%;height:auto;border-radius:8px;display:block}
.card .en{font-size:25px;font-weight:bold;margin-top:4px;word-break:keep-all}
.card .zh{font-size:16px;color:#666}
.card.playing,.row.playing,.chip.playing{border-color:var(--cr);background:#FFF0F5}
.lcard{text-align:left;padding:12px 14px}
.lcard .no{display:inline-block;background:var(--or);color:#fff;border-radius:50%;width:38px;height:38px;line-height:38px;text-align:center;font-weight:bold;font-size:21px;margin-right:8px}
.lcard .nm{font-size:20px;font-weight:bold}
.lcard .ws{font-size:15px;color:#666;margin-top:4px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:7px 10px;margin:7px 0;flex-wrap:wrap}
.row .tx{flex:1;min-width:200px}
.row .en{font-size:23px}
.row .zh{font-size:15px;color:#666}
.pb{border:0;background:var(--or);color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;flex:none;line-height:42px;padding:0}
.pb.m{background:var(--bl)}
.pb:hover{filter:brightness(1.1)}
.dlg{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin:10px 0}
.dlg .ln{display:flex;align-items:center;gap:10px;padding:5px 0}
.dlg .ln+.ln{border-top:1px dashed var(--line)}
.dlg .who{font-weight:bold;color:var(--or);width:26px;flex:none}
.dlg .ln.a .who{color:var(--bl)}
.note{background:#FFF6D0;border:2px solid #E4C766;border-radius:12px;padding:8px 14px;margin:10px 0;font-size:18px}
.note li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:20px;padding:3px 14px;font-size:22px}
.chip:hover{border-color:var(--or)}
.pair{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 8px;justify-content:center}
.pair span{color:#aaa}
.q{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.q .hd2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q .num{font-weight:bold;color:var(--pu);min-width:26px}
.q .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 16px;font-size:22px;text-align:left}
.opt:hover{border-color:var(--pu)}
.opt.ok{background:#DDF3E4;border-color:var(--gr)} .opt.no{background:#FDE2E2;border-color:#D01010}
.fb{font-weight:bold;margin-left:8px} .fb.ok{color:var(--gr)} .fb.no{color:#D01010}
.q input{font-family:inherit;font-size:23px;border:0;border-bottom:3px solid var(--pu);background:#F8F4FF;padding:2px 8px;width:220px;max-width:100%}
.q img.qi{width:150px;border-radius:8px;border:1px solid var(--line)}
.btn{border:2px solid var(--pu);background:#fff;color:var(--pu);border-radius:10px;padding:4px 14px;font-size:18px}
.btn.fill{background:var(--pu);color:#fff}
.btn.or{border-color:var(--or);color:var(--or)} .btn.or.fill{background:var(--or);color:#fff}
.ans{color:#D01010;font-weight:bold;font-size:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
audio{width:100%;max-width:520px}
.trk{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.trk b{display:block;margin-bottom:4px}
.figure{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;margin:10px 0;text-align:center}
.figure img{max-width:100%;height:auto}
.teacher-only{display:none} body.teacher .teacher-only{display:revert}
body.teacher .tbox{background:#FFF0F0;border:2px dashed #D01010;border-radius:12px;padding:8px 14px;margin:10px 0;color:#B00;font-size:17px}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#gate.off{display:none}
#gate form{background:#fff;border:3px solid var(--or);border-radius:20px;padding:26px 30px;text-align:center;max-width:420px;width:100%;box-shadow:0 6px 24px rgba(0,0,0,.08)}
#gate img{height:110px}
#gate h2{margin:8px 0 2px}
#gate p{margin:4px 0 14px;color:#666;font-size:17px}
#gate input{font-family:inherit;font-size:26px;text-align:center;width:100%;border:2px solid var(--line);border-radius:12px;padding:8px;letter-spacing:3px}
#gate input:focus{outline:none;border-color:var(--or)}
#gate button{margin-top:14px;width:100%;border:0;border-radius:12px;background:var(--or);color:#fff;font-size:22px;padding:9px}
#gate .err{color:#D01010;min-height:1.6em;font-size:17px;margin-top:8px}
body.locked header,body.locked main,body.locked footer{display:none}
#proj{position:fixed;inset:0;background:#1d1a26;color:#fff;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
#proj.on{display:flex}
#proj img{max-height:52vh;max-width:86vw;border-radius:18px;background:#fff}
#proj .pw{font-size:min(14vw,120px);font-weight:bold;line-height:1.15;margin-top:1vh;min-height:1.2em;text-align:center}
#proj .pz{font-size:min(6vw,44px);color:#FFD76A;min-height:1.4em}
#proj .pc{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2vh}
#proj .pc button{font-size:22px;border-radius:12px;border:0;padding:8px 18px;background:#fff;color:#222}
#proj .pc button.x{background:#C2185B;color:#fff}
#proj .pn{position:absolute;top:10px;left:16px;font-size:20px;color:#bbb}
footer{text-align:center;color:#888;font-size:14px;padding:20px}
@media(max-width:600px){body{font-size:17px}.hd h1{font-size:20px}.card .en{font-size:21px}.row .en{font-size:20px}}
</style>
</head>

<script>
const DATA = {"topics": [{"id": 1, "title": "What Are These?", "zh": "水果和食物", "color": "#E8802A", "words": [{"w": "apples", "zh": "蘋果", "img": "w_apples.png", "a": "w_669042a249.mp3"}, {"w": "bananas", "zh": "香蕉", "img": "w_bananas.png", "a": "w_292f1362e8.mp3"}, {"w": "oranges", "zh": "柳橙", "img": "w_oranges.png", "a": "w_42085d9e7c.mp3"}, {"w": "watermelons", "zh": "西瓜", "img": "w_watermelons.png", "a": "w_0c4a0936d3.mp3"}, {"w": "hamburgers", "zh": "漢堡", "img": "w_hamburgers.png", "a": "w_39dd4f753b.mp3"}, {"w": "hot dogs", "zh": "熱狗", "img": "w_hot_dogs.png", "a": "w_a3010180a8.mp3"}, {"w": "sandwiches", "zh": "三明治", "img": "w_sandwiches.png", "a": "w_0f2b381692.mp3"}, {"w": "these", "zh": "這些", "img": "t_these.png", "a": "w_7249983bb9.mp3"}, {"w": "those", "zh": "那些", "img": "t_those.png", "a": "w_7aa5124461.mp3"}, {"w": "like", "zh": "喜歡", "img": "t_like.png", "a": "w_9cf22144a4.mp3"}], "note": ["They're = They are（它們是）。回答 What are these / those? 都用 They're 開頭。", "these 這些（近）／those 那些（遠）。東西很多個，後面要加 s；sandwich 要加 es。"], "dialogs": [{"q": {"t": "What are these?", "zh": "這些是什麼？", "a": "s_c397efe278.mp3"}, "a": {"t": "They're apples.", "zh": "它們是蘋果。", "a": "s_c6352fc353.mp3"}}, {"q": {"t": "What are those?", "zh": "那些是什麼？", "a": "s_ba4a4ecd58.mp3"}, "a": {"t": "They're hot dogs.", "zh": "它們是熱狗。", "a": "s_5f5e8fe5ed.mp3"}}, {"q": {"t": "What are these?", "zh": "這些是什麼？", "a": "s_c397efe278.mp3"}, "a": {"t": "They're sandwiches.", "zh": "它們是三明治。", "a": "s_8d46856ab1.mp3"}}, {"q": {"t": "What are those?", "zh": "那些是什麼？", "a": "s_ba4a4ecd58.mp3"}, "a": {"t": "They're watermelons.", "zh": "它們是西瓜。", "a": "s_825902cd77.mp3"}}, {"q": {"t": "Do you like bananas?", "zh": "你喜歡香蕉嗎？", "a": "s_c8b8d31182.mp3"}, "a": {"t": "Yes, I do.", "zh": "是的，我喜歡。", "a": "s_bc6af94714.mp3"}}, {"q": {"t": "Do you like oranges?", "zh": "你喜歡柳橙嗎？", "a": "s_ca37ef4d16.mp3"}, "a": {"t": "No, I don't. I like apples.", "zh": "不，我不喜歡。我喜歡蘋果。", "a": "s_ed616d9444.mp3"}}, {"q": {"t": "Do you like hot dog let UNIT = 0;                          // 選了年級後：0 = 兩課都看, 1 = 第一課, 2 = 第二課
const UT = () => GRADE && UNIT ? (GRADE === 3 ? [1, 3] : [2, 4])[UNIT - 1] : 0;
const G = arr => { if (!GRADE) return arr; const u = UT(); return arr.filter(x => (!x.g || x.g === GRADE) && (!u || !x.u || x.u === u)); };
const gname = s => GRADE ? s.replace(/主題 (\d)、(\d)/, (m, a, b) => '主題 ' + (GRADE === 3 ? a : b)) : s;
const player = new Audio();
function play(file, node, onend) {
  player.pause(); if (curEl) curEl.classList.remove('playing');
  player.src = U('audio/' + file); player.playbackRate = slow ? 0.7 : 1;
  curEl = node || null; if (curEl) curEl.classList.add('playing');
  player.onended = () => { if (curEl) curEl.classList.remove('playing'); curEl = null; if (onend) onend(); };
  player.play().catch(() => {});
}
function playSeq(files, i) { i = i || 0; if (i < files.length) play(files[i], null, () => setTimeout(() => playSeq(files, i + 1), 450)); }
function pbtn(file, cls) { const b = el('button', 'pb ' + (cls || ''), '&#9654;'); b.title = '播放'; b.onclick = e => { e.stopPropagation(); play(file, b.closest('.row,.ln,.q,.card') || b); }; return b; }

/* ---------- password gate ---------- */
const hsh = s => { let a = 0xdeadbeef ^ 7, b = 0x41c6ce57 ^ 7; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); } a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909); b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909); return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36); };
const PWH = 'kysu3z28n4';
function unlock() { document.body.classList.remove('locked'); $('#gate').classList.add('off'); }
$('#gform').addEventListener('submit', e => { e.preventDefault(); const v = $('#gpw').value.trim().toUpperCase();
  if (hsh(v) === PWH) { try { sessionStorage.setItem('rd_ok', PWH); } catch (x) {} unlock(); } else { $('#gerr').textContent = '密碼不正確，請再試一次'; $('#gpw').value = ''; $('#gpw').focus(); } });
try { if (sessionStorage.getItem('rd_ok') === PWH) unlock(); } catch (x) {}
if (document.body.classList.contains('locked')) $('#gpw').focus();

$('#u2').onclick = () => { setUnit(UNIT === 2 ? 0 : 2); render(); };
try { const s = +localStorage.getItem('rd_grade'); if (s === 3 || s === 4) { setGrade(s); const u = +localStorage.getItem('rd_unit'); if (u === 1 || u === 2) setUnit(u); } } catch (x) {}
window.addEventListener('hashchange', render);
$('#slow').onclick = e => { slow = !slow; e.target.classList.toggle('on', slow); };
$('#tch').onclick = e => { const on = document.body.classList.toggle('teacher'); e.target.classList.toggle('on', on); try { localStorage.setItem('rd_teacher', on ? '1' : ''); } catch (x) {} };
try { if (localStorage.getItem('rd_teacher')) { document.body.classList.add('teacher'); $('#tch').classList.add('on'); } } catch (x) {}
$('#main').innerHTML = '<p class="lead">載入中…</p>';
Promise.all(["pack1.json", "pack2.json"].map(f => fetch(f).then(r => r.json()))).then(all => { all.forEach(rows => rows.forEach(r => PACK[r[0]] = r[1])); }).catch(() => {}).then(render);
</script>
</body>
</html>
